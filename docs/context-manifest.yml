# docs/context-manifest.yml — PCS status map (operator-owned; spec §4.4)
#
# Fully-classified manifest. Every item carries a 'justification' citing the rule applied.
# Valid statuses: current | superseded | deprecated | historical.
#
# split_required: true marks a dual-purpose entry where a still-current finding shares
# one chunk with a stale number. The entry stays classified for its current finding; D3's
# chunker MUST split it so the stale number becomes its own superseded chunk (see split_note).
# D3 is not done until every split_required entry is split; golden query #1 is the acceptance test.
#
# latent_split_note records the SAME dual-purpose defect on an entry that is NOT on the default
# surface (historical). No status change and no D3 obligation today — it is off-surface, so the
# stale number is not served unless deliberately recalled. The note makes the debt machine-visible
# so that if the entry is ever promoted to current or pulled by explicit recall, the split is
# performed rather than shipping the misread-as-fact. See 'pcs manifest-check'.

# --- Tier-1 pinned documents (loaded whole, never chunked/embedded; spec §4.1) ---
# These are the program's current-state operating docs. Always 'current'. They live
# in a separate section so they can never be swept into the Tier-2 chunk/embed path;
# validation enforces that a pinned doc is never also a Tier-2 target.
